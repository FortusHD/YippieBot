name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call: {}

env:
  HUSKY: 0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create config from example
        run: cp config/default.example.json config/default.json

      - name: Run tests
        run: npm test
        env:
          TZ: Europe/Berlin
          APP_ENV: dev
          BOT_TOKEN_DEV: dummy
          BOT_CLIENT_ID_DEV: dummy
          BOT_TOKEN_PROD: dummy
          BOT_CLIENT_ID_PROD: dummy
          GOOGLE_KEY: dummy
          LAVALINK_HOST: localhost
          LAVALINK_PORT: 2333
          LAVALINK_PW: dummy
